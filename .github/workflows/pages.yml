name: Publicar plataforma no GitHub Pages
on:
  push:
    branches: [main, 'feature/plataforma-visual']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plataforma-pages-${{ github.event_name == 'pull_request' && github.ref || 'publicacao' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Testar interpretador e desafios
        run: node --test tests/web/engine.test.mjs
      - name: Verificar estrutura e empacotamento
        run: |
          python3 scripts/gerar.py
          python3 scripts/validar.py
          python3 -m unittest discover -s tests -q
          git diff --exit-code
          python3 scripts/construir_plataforma.py
      - name: Preparar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6.0.0
      - name: Guardar artefato público
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar versão
        id: deployment
        uses: actions/deploy-pages@v5.0.1
