name: Validar ontologia com Open Ontologies
on:
  push:
    branches: [main, develop, 'feature/**']
    paths: ['data/**', 'ontologia/**', 'scripts/*ontologia*', 'ferramentas/open-ontologies.json', '.github/workflows/ontologia.yml']
  pull_request:
    paths: ['data/**', 'ontologia/**', 'scripts/*ontologia*', 'ferramentas/open-ontologies.json', '.github/workflows/ontologia.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ontologia:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Gerar RDF e verificar exportações
        run: |
          python3 scripts/ontologia.py
          git diff --exit-code -- ontologia/
      - name: Obter binários fixados e conferir hashes
        run: |
          python3 - <<'PY'
          import json,hashlib,os,urllib.request
          from pathlib import Path
          lock=json.loads(Path('ferramentas/open-ontologies.json').read_text())
          for name,url,digest in [('open-ontologies',lock['linux_x86_64_url'],lock['linux_x86_64_sha256']),('oo-cert',lock['checker_url'],lock['checker_sha256'])]:
              target=Path(os.environ['RUNNER_TEMP'])/name
              with urllib.request.urlopen(url,timeout=90) as response:target.write_bytes(response.read())
              assert hashlib.sha256(target.read_bytes()).hexdigest()==digest, 'SHA256 inesperado'
              target.chmod(0o755)
          PY
      - name: Validar, consultar, testar impacto e reversão na sandbox
        run: |
          python3 scripts/verificar_ontologia.py --bin "$RUNNER_TEMP/open-ontologies" --checker "$RUNNER_TEMP/oo-cert" --saida "$RUNNER_TEMP/verificacao-ontologia.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'verificacao-ontologia.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write(f"Estrutura: {r['status_estrutural']}; recursos: {r['individuos']}; SHACL: {r['shacl']['conforms']}.\n\n")
              out.write(f"Checker independente: {r['inferencia']['checker']['status']}. Não equivale à avaliação científica.\n")
          PY
